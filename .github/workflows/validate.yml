name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check stations.js
          node --check discovery.js
          node --check library.js
          node --check app.js
      - name: Tests
        run: node --test tests/*.test.cjs
      - name: Whitespace
        run: git diff --check "$(git merge-base HEAD origin/main)" HEAD
